; ESP32 摄像头测试项目
; 支持 AI-Thinker ESP32-CAM / 自制摄像头模块

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 串口设置
monitor_speed = 115200
upload_speed = 921600
upload_port = COM4

; 编译选项
build_flags = 
    -D CORE_DEBUG_LEVEL=2
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D ARDUINO_USB_CDC_ON_BOOT=0

; 分区表 - 更大的空间给程序
board_build.partitions = min_spiffs.csv

; 库依赖
lib_deps =
    esp32-camera
