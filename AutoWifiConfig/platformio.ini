; PlatformIO 项目配置文件
; ESP8266 自动配网项目

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

; 串口配置
monitor_speed = 115200
upload_speed = 115200
upload_port = COM4

; 编译选项
build_flags = 
    -D ARDUINO_ESP8266_WEMOS_D1MINI

; 库依赖
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4
    adafruit/Adafruit Unified Sensor @ ^1.1

; ============================================
; ESP-01S 配置 (1MB Flash)
; ============================================
[env:esp01s]
platform = espressif8266
board = esp01_1m
framework = arduino

; 串口配置
monitor_speed = 115200
upload_speed = 115200
upload_port = COM6

; 库依赖
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4
    adafruit/Adafruit Unified Sensor @ ^1.1

; Flash 大小 1MB，SPIFFS 64KB
board_build.ldscript = eagle.flash.1m64.ld
