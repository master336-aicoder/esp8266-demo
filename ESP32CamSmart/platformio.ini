; ESP32-CAM 智能摄像头项目
; 功能：自动配网 + Web管理 + 拍照 + 视频录制 + SD卡管理

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; 串口设置
monitor_speed = 115200
upload_speed = 921600
upload_port = COM4

; 编译选项
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D ARDUINO_USB_CDC_ON_BOOT=0

; 库依赖
lib_deps =
    esp32-camera
